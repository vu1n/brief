[project]
name = "brief"
version = "0.2.2"
description = "Doc-driven development as a governance system: resolvable, versioned decision refs for AI-authored code."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "pydantic>=2",
]

[project.optional-dependencies]
rich = ["rich>=13"]
dev = ["pytest>=8"]

[project.scripts]
brief = "brief.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brief"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "brief/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
