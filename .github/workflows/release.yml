# Tags and releases vX.Y.Z when a push to main carries a version no tag has yet.
# Bumping `version` in pyproject.toml (and src/brief/__init__.py) is the release decision;
# consuming repos see the new tag via their brief CI's update check.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency: release
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        # Tag and release are checked separately so a re-run finishes a half-done release.
        run: |
          v="v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then echo "tagged=true" >> "$GITHUB_OUTPUT"; else echo "tagged=false" >> "$GITHUB_OUTPUT"; fi
          if gh release view "$v" >/dev/null 2>&1; then echo "released=true" >> "$GITHUB_OUTPUT"; else echo "released=false" >> "$GITHUB_OUTPUT"; fi
      - name: tests
        if: steps.v.outputs.released == 'false'
        run: uv run --extra dev --extra s1 pytest -q
      - name: tag
        if: steps.v.outputs.tagged == 'false'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
      - name: release
        if: steps.v.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
